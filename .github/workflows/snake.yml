name: Generate Snake Animation

on:
  # Ejecutar automáticamente cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Genera el archivo snake.svg
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Pabl0vargas
          # Genera un archivo llamado snake.svg en la raíz del repo
          outputs: snake.svg 
      
      # Sube el archivo snake.svg de vuelta al repositorio
      - name: Push snake.svg
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add snake.svg
          git commit -m "chore: generate snake.svg" || exit 0
          git push
