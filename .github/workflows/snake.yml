name: Generate Custom Snake

on:
  # Se ejecuta cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  
  #permite ejecutarlo manualmente
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Trae el código del repositorio
      - uses: actions/checkout@v3

      # 2. Genera la animación PASANDO LOS COLORES EN LA URL DE SALIDA
      - uses: Platane/snk@v3
        with:
          github_user_name: Pabl0vargas
          
          
          outputs: |
            dist/snake-generated.svg?color_snake=0000FF&color_dots=9BE9A8,40C463,30A14E,216E39&color_bg=0D1117&color_grid=161B22

      
      - name: Push custom snake
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add dist/snake-generated.svg
          git commit -m "chore: generate custom snake" || exit 0
          git push
