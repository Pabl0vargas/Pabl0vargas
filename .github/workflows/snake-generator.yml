name: Generate Custom Snake Animation

on:
  # Se ejecuta cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v3

    
      - uses: Platane/snk@v3
        with:
          github_user_name: Pabl0vargas
          
          
          outputs: snake-custom.svg
          
          color_snake: '#000000'
          color_dots: '#9BE9A8,#40C463,#30A14E,#216E39'
          color_bg: '#0D1117'
          color_grid: '#161B22'

      
      - name: Push custom snake animation
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add snake-custom.svg
          git commit -m "chore: generate snake-custom.svg" || exit 0
          git push
